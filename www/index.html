<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <title>Mae</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="home-btn" id="homeBtn" hidden>
      <span aria-hidden="true">🏠</span> <span data-text="home">Home</span>
    </button>
    <div class="clock">
      <div id="time" class="time"></div>
      <div id="date" class="date"></div>
    </div>
    <div id="weather" class="weather" aria-live="polite"></div>
  </header>

  <main id="view"></main>

  <!-- Full-screen video player -->
  <div id="player" class="player" hidden>
    <div class="player-frame" id="playerFrame"></div>
    <div class="player-actions">
      <button class="big-btn secondary" id="openYouTubeBtn" data-text="openInYouTube">Open in YouTube</button>
      <button class="big-btn" id="closePlayerBtn">✕ <span data-text="close">Close</span></button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/feeds.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
